services:
  web:
    image: my-nginx-practice:v1
    ports:
      - "8080:80"
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    # ports не указаны: БД доступна только внутри сети compose

volumes:
  db_data:
